name: APT repository

# Publishes the signed APT repository on the gh-pages branch
# (https://hawkeynl.github.io/Stallo/, see docs/apt-repo.md):
# edge on every push to main, stable on tags v<major>.<minor>.<patch>.
# Pull requests build and verify the repository signed with a throwaway key
# and publish nothing.
on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:

permissions: {}

# One publish at a time: each run rebuilds the whole tree from gh-pages.
concurrency:
  group: ${{ github.event_name == 'push' && 'apt-publish' || format('apt-{0}', github.ref) }}
  cancel-in-progress: ${{ github.event_name != 'push' }}

jobs:
  # Runs the crates' build code, so it never sees the signing key.
  build:
    runs-on: ubuntu-26.04
    timeout-minutes: 30
    permissions:
      contents: read
    outputs:
      channel: ${{ steps.version.outputs.channel }}
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Pick channel and version
        id: version
        env:
          EVENT: ${{ github.event_name }}
          REF: ${{ github.ref }}
          SHA: ${{ github.sha }}
          REPO: ${{ github.repository }}
        run: |
          cargo_version=$(sed -n 's/^version = "\(.*\)"$/\1/p' Cargo.toml | head -n 1)
          if ! printf '%s\n' "$cargo_version" | grep -Eqx '[0-9]+\.[0-9]+\.[0-9]+'; then
            echo "::error::The version in Cargo.toml must look like 1.2.3."
            exit 1
          fi
          case $REF in
            refs/tags/v*)
              channel=stable version=${REF#refs/tags/v}
              if ! printf '%s\n' "$version" | grep -Eqx '[0-9]+\.[0-9]+\.[0-9]+'; then
                echo "::error::Release tags must look like v1.2.3."
                exit 1
              fi
              if [ "$version" != "$cargo_version" ]; then
                echo "::error::Tag v$version does not match version $cargo_version in Cargo.toml."
                exit 1
              fi
              ;;
            *)
              channel=edge
              # Sorts after every earlier edge build and before the release
              # of the version in Cargo.toml.
              version="$cargo_version~git$(date -u +%Y%m%d%H%M%S).$(printf %.7s "$SHA")"
              if [ "$EVENT" = push ] &&
                [ "$(git ls-remote "https://github.com/$REPO.git" refs/heads/main | cut -f 1)" != "$SHA" ]; then
                echo "::error::main has moved on; this run would publish an older build as the newest."
                exit 1
              fi
              ;;
          esac
          echo "channel=$channel" >>"$GITHUB_OUTPUT"
          echo "version=$version" >>"$GITHUB_OUTPUT"
          echo "Building stallo $version for $channel"
      - run: sudo apt-get update && sudo apt-get install -y --no-install-recommends libgtk-4-dev libadwaita-1-dev pkg-config
      # rust-toolchain.toml selects the pinned toolchain.
      - name: Build the packages
        env:
          STALLO_DEB_VERSION: ${{ steps.version.outputs.version }}
        run: packaging/build-deb.sh --gui
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: deb
          path: |
            target/deb/stallo_${{ steps.version.outputs.version }}_amd64.deb
            target/deb/stallo-gui_${{ steps.version.outputs.version }}_amd64.deb
          retention-days: 3
          if-no-files-found: error

  # A fresh runner that runs no code from the build: only apt-repo.sh.
  repo:
    needs: build
    runs-on: ubuntu-26.04
    timeout-minutes: 15
    permissions:
      contents: read
    # The secrets live in this environment, which only main and v* tags may
    # use (docs/apt-repo.md). Pull requests use no environment and no key.
    environment: ${{ github.event_name == 'push' && 'apt-signing' || '' }}
    outputs:
      pages-sha: ${{ steps.fetch.outputs.sha }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          sparse-checkout: packaging/apt-repo.sh
          sparse-checkout-cone-mode: false
      - run: sudo apt-get update && sudo apt-get install -y --no-install-recommends apt-utils
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: deb
          path: ${{ runner.temp }}/deb
      - name: Fetch the published tree
        id: fetch
        env:
          REPO: ${{ github.repository }}
        run: |
          site=$RUNNER_TEMP/site
          url=https://github.com/$REPO.git
          rc=0
          git ls-remote --exit-code --heads "$url" gh-pages >/dev/null || rc=$?
          case $rc in
            0)
              git clone -q --depth 1 --branch gh-pages "$url" "$site"
              echo "sha=$(git -C "$site" rev-parse HEAD)" >>"$GITHUB_OUTPUT"
              rm -rf "$site/.git"
              ;;
            2) mkdir "$site" ;; # no gh-pages yet: the first publish
            *) echo "::error::git ls-remote failed ($rc)" && exit 1 ;;
          esac
      - name: Build and sign the repository
        env:
          EVENT: ${{ github.event_name }}
          CHANNEL: ${{ needs.build.outputs.channel }}
          VERSION: ${{ needs.build.outputs.version }}
          KEY: ${{ github.event_name == 'push' && secrets.STALLO_APT_SIGNING_KEY || '' }}
          PASSPHRASE: ${{ github.event_name == 'push' && secrets.STALLO_APT_SIGNING_PASSPHRASE || '' }}
        run: |
          GNUPGHOME=$(mktemp -d)
          export GNUPGHOME
          trap 'gpgconf --kill all; rm -rf "$GNUPGHOME"' EXIT
          if [ "$EVENT" = push ]; then
            if [ -z "$KEY" ]; then
              echo "::error::Secret STALLO_APT_SIGNING_KEY is not set in environment apt-signing; refusing to publish an unsigned repository. See docs/apt-repo.md."
              exit 1
            fi
            printf '%s' "$PASSPHRASE" >"$GNUPGHOME/passphrase"
            printf 'pinentry-mode loopback\npassphrase-file %s\n' "$GNUPGHOME/passphrase" >"$GNUPGHOME/gpg.conf"
            printf '%s\n' "$KEY" | gpg --batch --quiet --import
          else
            gpg --batch --quiet --passphrase '' --quick-gen-key "Stallo CI throwaway key" ed25519 sign 1d
          fi
          unset KEY PASSPHRASE
          packaging/apt-repo.sh "$RUNNER_TEMP/site" "$CHANNEL" \
            "$RUNNER_TEMP/deb/stallo_${VERSION}_amd64.deb" "$RUNNER_TEMP/deb/stallo-gui_${VERSION}_amd64.deb"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: site
          path: ${{ runner.temp }}/site
          include-hidden-files: true
          retention-days: 3
          if-no-files-found: error

  # A clean Ubuntu 26.04 must accept the signatures, resolve the packages
  # with their dependencies and download them before anything is published.
  verify:
    needs: [build, repo]
    runs-on: ubuntu-26.04
    timeout-minutes: 15
    permissions: {}
    container: ubuntu:26.04@sha256:f144425ff09be612d6d9ad965196e9cdc23dae1f42110a8a11a3e9a8198759f7
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: site
          path: /srv/stallo
      - name: apt update, install --dry-run, download
        env:
          VERSION: ${{ needs.build.outputs.version }}
        run: |
          cat >/etc/apt/sources.list.d/stallo.sources <<EOF
          Types: deb
          URIs: file:/srv/stallo
          Suites: stable edge
          Components: main
          Architectures: amd64
          Signed-By: /srv/stallo/stallo.asc
          EOF
          apt-get update --error-on=any
          apt-get install --dry-run "stallo=$VERSION" "stallo-gui=$VERSION"
          # Checks the .debs against the signed index.
          cd /tmp && apt-get download "stallo=$VERSION" "stallo-gui=$VERSION"

  publish:
    needs: [build, repo, verify]
    if: github.event_name == 'push'
    runs-on: ubuntu-26.04
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: site
          path: ${{ runner.temp }}/site
      # One orphan commit, force-pushed: the branch never grows. The lease
      # fails the push if gh-pages changed since the repo job read it.
      - name: Push gh-pages
        env:
          OLD: ${{ needs.repo.outputs.pages-sha }}
          CHANNEL: ${{ needs.build.outputs.channel }}
          VERSION: ${{ needs.build.outputs.version }}
        run: |
          # Lets the push skip the .deb files gh-pages already has.
          [ -z "$OLD" ] || git fetch -q --depth 1 origin gh-pages
          git checkout -q --orphan gh-pages-publish
          git rm -rq --cached .
          git --work-tree="$RUNNER_TEMP/site" add -A
          git -c user.name='github-actions[bot]' \
            -c user.email='41898282+github-actions[bot]@users.noreply.github.com' \
            commit -qm "Publish stallo $VERSION ($CHANNEL)"
          git push -q --force-with-lease="refs/heads/gh-pages:$OLD" origin HEAD:refs/heads/gh-pages
