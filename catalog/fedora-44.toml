# Fedora 44 Cloud Base (Generic), amd64, qcow2, UEFI/GPT. Release files are
# pinned: a new Fedora release or respin gets a catalog change.
id = "fedora-44"
name = "Fedora 44 Cloud Base (Generic)"
os = "linux"
firmware = "secure-boot"
url = "https://dl.fedoraproject.org/pub/fedora/linux/releases/44/Cloud/x86_64/images/Fedora-Cloud-Base-Generic-44-1.7.x86_64.qcow2"
max_size = 2_147_483_648

trust = "signed-sums"
sums_url = "https://dl.fedoraproject.org/pub/fedora/linux/releases/44/Cloud/x86_64/images/Fedora-Cloud-44-1.7-x86_64-CHECKSUM"
# The checksum list is clearsigned: no separate signature file.
sig_url = ""
sums_format = "bsd"
# Vendored in catalog/keys/fedora.gpg: "Fedora (44)
# <fedora-44-primary@fedoraproject.org>". The fingerprint was checked
# against fedoraproject.org/security, the fedora-repos package source
# (src.fedoraproject.org, branch f44) and keyserver.ubuntu.com
# (2026-10-15).
keyring = "fedora.gpg"
signing_key = "36F612DCF27F7D1A48A835E4DBFCF71C6D9F90A6"

# The image ships qemu-guest-agent. SELinux confines it (virt_qemu_ga_t)
# and refuses what exec needs: starting a systemd-run scope ("Access
# denied") and setpriv switching to the guest user (setcap). The seed makes
# only that domain permissive.
agent = "preinstalled"
qga_permissive = true
