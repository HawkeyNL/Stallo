[package]
name = "stallo"
version = "0.1.0"
edition = "2024"
rust-version = "1.97"
description = "Agent-first VM manager for Ubuntu (QEMU/KVM)"
repository = "https://github.com/HawkeyNL/Stallo"
publish = false

[dependencies]
anyhow = "1.0.104"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
sha2 = "0.11.1"
tokio = { version = "1.53.2", features = ["io-util", "macros", "net", "process", "rt", "sync", "time"] }
toml = "1.1.8"
tracing = { version = "0.1.44", default-features = false, features = ["std"] }

[dev-dependencies]
tempfile = "3.27.0"

[lints.rust]
# Unsafe code is denied crate-wide; the few places that need it (pre_exec)
# opt in locally with a SAFETY comment.
unsafe_code = "deny"
