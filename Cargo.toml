[package]
name = "stallo"
version = "0.1.0"
edition = "2024"
rust-version = "1.97"
description = "Agent-first VM manager for Ubuntu (QEMU/KVM)"
repository = "https://github.com/HawkeyNL/Stallo"
publish = false

[dependencies]
anyhow = "1.0.104"
base64 = "0.23.1"
clap = { version = "4.6.7", default-features = false, features = ["std", "derive", "help", "usage", "error-context"] }
landlock = "0.4.7"
libc = "0.2.190"
rustix = { version = "1.1.5", features = ["fs", "process"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
sha2 = "0.11.1"
tokio = { version = "1.53.2", features = ["io-util", "macros", "net", "process", "rt", "rt-multi-thread", "signal", "sync", "time"] }
toml = "1.1.8"
tracing = { version = "0.1.44", default-features = false, features = ["std"] }
tracing-subscriber = { version = "0.3.23", default-features = false, features = ["fmt", "std"] }

[dev-dependencies]
tempfile = "3.27.0"

[lints.rust]
# Unsafe code is denied crate-wide; the few places that need it (pre_exec)
# opt in locally with a SAFETY comment.
unsafe_code = "deny"
