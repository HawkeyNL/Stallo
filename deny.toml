# cargo-deny: https://embarkstudios.github.io/cargo-deny/
[graph]
targets = ["x86_64-unknown-linux-gnu"]

[advisories]
yanked = "deny"

[licenses]
allow = ["MIT", "Apache-2.0", "Unicode-3.0", "BSD-3-Clause", "ISC", "Zlib"]
confidence-threshold = 0.9
# The list is shared by future dependencies; do not warn while some are unused.
unused-allowed-license = "allow"
# Stallo itself is not published and its licence is still to be decided.
private = { ignore = true }

[bans]
multiple-versions = "warn"
wildcards = "deny"

[sources]
unknown-registry = "deny"
unknown-git = "deny"
